services:
  nginx:
    image: nginx:1-alpine
    restart: unless-stopped
    configs:
      - source: redirect
        target: /etc/nginx/conf.d/default.conf
    networks:
      - traefik_network
    #ports:
    #  - "${SERVICE_PORT:-80}:80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_network"
      - "traefik.http.services.subdomred.loadbalancer.server.port=${SERVICE_PORT:-80}"
      - "traefik.http.routers.subdomred.entrypoints=websecure"

      # Note: labels can't be repeated (only the last one matters, apparently)
      - "traefik.http.routers.subdomred.rule=
        Host(`redirect.${BASE_DOMAIN:?define_me}`)
        ||
        Host(`adhesion.${BASE_DOMAIN:?define_me}`)
        ||
        Host(`don.${BASE_DOMAIN:?define_me}`)
        ||
        Host(`telegram.${BASE_DOMAIN:?define_me}`)
        ||
        Host(`discord.${BASE_DOMAIN:?define_me}`)
      "

      - "traefik.http.routers.subdomred.tls=true"
      - "traefik.http.routers.subdomred.tls.certresolver=leresolver"



configs:
  redirect:
    content: |
      server {
          server_name  redirect.${BASE_DOMAIN:?define_it_in_env};
          listen       80;
          listen  [::]:80;
          access_log off;
          return 301 ${BASE_DOMAIN:?define_it_in_env};
      }
      server {
          server_name  adhesion.${BASE_DOMAIN:?define_it_in_env};
          listen       80;
          listen  [::]:80;
          access_log off;
          return 301 https://www.helloasso.com/associations/mieux-voter;
      }
      server {
          server_name  don.${BASE_DOMAIN:?define_it_in_env};
          listen       80;
          listen  [::]:80;
          access_log off;
          return 301 https://www.paypal.com/donate/?hosted_button_id=QD6U4D323WV4S;
      }
      server {
          server_name  telegram.${BASE_DOMAIN:?define_it_in_env};
          listen       80;
          listen  [::]:80;
          access_log off;
          return 301 https://t.me/+geMbCXIbpSVmN2M8;
      }
      server {
          server_name  discord.${BASE_DOMAIN:?define_it_in_env};
          listen       80;
          listen  [::]:80;
          access_log off;
          return 301 https://discord.gg/k9YRuZPSZs;
      }

networks:
  traefik_network:
    external: true
